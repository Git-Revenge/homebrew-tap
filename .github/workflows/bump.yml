name: Bump cask

# Follows the latest non-prerelease Git Revenge release. Runs daily, by hand, or when the
# main repo sends a "release" repository_dispatch. Needs no secrets: it only writes here.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [release]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh api repos/Git-Revenge/GitRevenge/releases/latest)
          version=$(jq -r '.tag_name | ltrimstr("v")' <<<"$release")
          dmg="GitRevenge-$version-macos-universal.dmg"
          sha=$(jq -r --arg n "$dmg" '.assets[] | select(.name == $n) | .digest | ltrimstr("sha256:")' <<<"$release")
          if [ -z "$sha" ] || [ "$sha" = "null" ]; then
            echo "::error::$dmg has no sha256 digest on release v$version"; exit 1
          fi
          cask=Casks/gitrevenge.rb
          current=$(sed -n 's/^  version "\(.*\)"$/\1/p' "$cask")
          if [ "$current" = "$version" ]; then echo "Already at $version"; exit 0; fi
          sed -i "s/^  version \".*\"$/  version \"$version\"/; s/^  sha256 \".*\"$/  sha256 \"$sha\"/" "$cask"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "gitrevenge $version"
          git push
