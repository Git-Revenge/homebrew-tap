name: Test cask

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    env:
      # Online audit calls the GitHub API; unauthenticated, shared runners hit the 60/hour limit.
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Point Homebrew at this checkout
        run: |
          tap="$(brew --repository)/Library/Taps/git-revenge/homebrew-tap"
          mkdir -p "$(dirname "$tap")"
          ln -s "$GITHUB_WORKSPACE" "$tap"
      - run: brew style --cask git-revenge/tap/gitrevenge
      # A plain `brew install` trusts the cask it names; audit needs the tap trusted first.
      - run: brew trust git-revenge/tap
      - run: brew audit --cask --strict --online git-revenge/tap/gitrevenge
      - run: brew install --cask git-revenge/tap/gitrevenge
      - run: test -d "/Applications/Git Revenge.app"
      # The gitrevenge command is on the PATH, and it opens the app that was installed.
      - name: Run the gitrevenge command
        run: |
          test "$(command -v gitrevenge)" = "$(brew --prefix)/bin/gitrevenge"
          cat "$(command -v gitrevenge)"
          # Nobody is here to answer Gatekeeper's "downloaded from the Internet" question.
          xattr -dr com.apple.quarantine "/Applications/Git Revenge.app"
          gitrevenge
          for i in $(seq 30); do pgrep -x gitrevenge >/dev/null && break; sleep 1; done
          ps -axo comm= | grep -x "/Applications/Git Revenge.app/Contents/MacOS/gitrevenge"
          pkill -x gitrevenge
      - run: brew uninstall --cask --zap git-revenge/tap/gitrevenge
      - run: test ! -e "$(brew --prefix)/bin/gitrevenge"
